version: "3.9"
services:
  app:
    image: node:22.12.0-alpine
    working_dir: /app
    command: sh -c "npm i -g npm@10.0.0 && npm ci && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # make sure this points to postgres below for local
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  app_node_modules:
  pgdata:
